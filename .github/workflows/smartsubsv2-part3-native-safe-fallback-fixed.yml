        run: node --test test/v2-part3-native-safe-fallback.test.js

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          git diff --check

      - name: Verify quota policy and patch scope
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "function subtitleMatchConfidence" src/selector.js
          grep -Fq "native-malay-with-auto-fallback" src/subtitles.js
          grep -Fq "weak-native-wait-for-user-selection" src/subtitles.js
          grep -Fq "'nativeDecision'" src/diagnostics.js
          grep -Fq "function shouldPrefetchAutoResult" src/cloudflare-worker.mjs
          grep -Fq "auto-prefetch-skipped" src/cloudflare-worker.mjs
          grep -Fq "Native Malay decision" src/cloudflare-worker.mjs
          grep -Fq "Verdict reference" src/cloudflare-worker.mjs
          grep -Fq "Raw recent events" src/cloudflare-worker.mjs

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(src/selector\.js|src/subtitles\.js|src/diagnostics\.js|src/cloudflare-worker\.mjs|test/v2-part3-native-safe-fallback\.test\.js|docs/V2_PART3_NATIVE_SAFE_FALLBACK\.md)$' || true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified Part 3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/selector.js \
            src/subtitles.js \
            src/diagnostics.js \
            src/cloudflare-worker.mjs \
            test/v2-part3-native-safe-fallback.test.js \
            docs/V2_PART3_NATIVE_SAFE_FALLBACK.md

          if git diff --cached --quiet; then
            echo "Part 3 is already applied."
