name: SmartSubsV2 Part 4.2 - Auto Delivery Race Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part4-2-auto-delivery-race
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Part 4.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f src/cloudflare-worker.mjs
          test -f src/translator.js
          test -f wrangler.jsonc
          test -f test/v2-part4-1-stable-auto-delivery.test.js
          test -f package-lock.json
          grep -Fq "function playerQueueWaitMaxMs(env)" src/cloudflare-worker.mjs
          grep -Fq "const finalCached = await cache.get(cacheKey)" src/cloudflare-worker.mjs
          grep -Fq "queueProfile: 'user-selected-stable'" src/cloudflare-worker.mjs
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq "Math.min(3, explicitConcurrency)" src/translator.js

      - name: Apply Part 4.2 race fix
