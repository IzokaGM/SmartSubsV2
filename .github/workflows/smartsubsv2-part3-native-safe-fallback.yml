name: SmartSubsV2 Part 3 - Native Malay Safe Fallback

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part3-native-safe-fallback
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Part 2 and friendly diagnose baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f src/selector.js
          test -f src/subtitles.js
          test -f src/diagnostics.js
          test -f src/cloudflare-worker.mjs
          test -f package-lock.json

          grep -Fq "function rankMalaySubtitles" src/selector.js
          grep -Fq "const rankedMalay = rankMalaySubtitles" src/subtitles.js
          grep -Fq "'malaySelectedId'" src/diagnostics.js
          grep -Fq "Malaysia time (MYT, Asia/Kuala_Lumpur)" src/cloudflare-worker.mjs
          grep -Fq "Raw recent events" src/cloudflare-worker.mjs

      - name: Apply quota-safe native Malay fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # selector.js
          path = Path("src/selector.js")
          text = path.read_text()

          anchor = "function rankEnglishSubtitles(subtitles, context = {}) {"
          helper = """function subtitleMatchConfidence(subtitle, index = 0, context = {}, score = null) {
            const actualScore = Number.isFinite(Number(score))
              ? Number(score)
              : scoreEnglishSubtitle(subtitle, index, context)
            const baseScore = 10000 - index
            const scoreUplift = actualScore - baseScore

            if (context.videoHash && exactMetadataMatch(subtitle, context.videoHash)) {
              return { level: 'STRONG', reason: 'exact-video-hash', scoreUplift }
            }

            if (context.videoSize && exactMetadataMatch(subtitle, context.videoSize)) {
              return { level: 'STRONG', reason: 'exact-video-size', scoreUplift }
            }

            if (scoreUplift >= 700) {
              return { level: 'STRONG', reason: 'strong-release-match', scoreUplift }
            }

            if (scoreUplift >= 250) {
              return { level: 'LIMITED', reason: 'partial-release-match', scoreUplift }
            }

            return { level: 'WEAK', reason: 'insufficient-sync-evidence', scoreUplift }
          }

          """
          if "function subtitleMatchConfidence(" not in text:
              if anchor not in text:
                  raise SystemExit("selector confidence anchor not found")
              text = text.replace(anchor, helper + anchor, 1)

          old_english = """function rankEnglishSubtitles(subtitles, context = {}) {
            return getEnglishSubtitles(subtitles)
              .map((subtitle, index) => ({
                subtitle,
                score: scoreEnglishSubtitle(subtitle, index, context)
              }))
              .sort((a, b) => b.score - a.score)
          }"""
          new_english = """function rankEnglishSubtitles(subtitles, context = {}) {
            return getEnglishSubtitles(subtitles)
              .map((subtitle, index) => {
                const score = scoreEnglishSubtitle(subtitle, index, context)
                return {
                  subtitle,
                  score,
                  confidence: subtitleMatchConfidence(subtitle, index, context, score)
                }
              })
              .sort((a, b) => b.score - a.score)
          }"""
          if "confidence: subtitleMatchConfidence(subtitle, index, context, score)" not in text:
              if old_english not in text:
                  raise SystemExit("rankEnglishSubtitles guard failed")
              text = text.replace(old_english, new_english, 1)

          old_malay = """function rankMalaySubtitles(subtitles, context = {}) {
            return getMalaySubtitles(subtitles)
              .map((subtitle, index) => ({
                subtitle,
                score: scoreMalaySubtitle(subtitle, index, context)
              }))
              .sort((a, b) => b.score - a.score)
          }"""
          new_malay = """function rankMalaySubtitles(subtitles, context = {}) {
            return getMalaySubtitles(subtitles)
              .map((subtitle, index) => {
                const score = scoreMalaySubtitle(subtitle, index, context)
                return {
                  subtitle,
                  score,
                  confidence: subtitleMatchConfidence(subtitle, index, context, score)
                }
              })
              .sort((a, b) => b.score - a.score)
          }"""
          if new_malay not in text:
              if old_malay not in text:
                  raise SystemExit("rankMalaySubtitles guard failed")
              text = text.replace(old_malay, new_malay, 1)

          old_export = """  scoreEnglishSubtitle,
            rankEnglishSubtitles,"""
          new_export = """  scoreEnglishSubtitle,
            subtitleMatchConfidence,
            rankEnglishSubtitles,"""
          if "  subtitleMatchConfidence," not in text:
              if old_export not in text:
                  raise SystemExit("selector export guard failed")
              text = text.replace(old_export, new_export, 1)

          path.write_text(text)

          # subtitles.js
          path = Path("src/subtitles.js")
          text = path.read_text()

          old_english_diag = """    englishSelectedScore: selectedEntry ? selectedEntry.score : null,
              englishSelectionStable: selectedEnglish === rankedWinner,
              englishTop:"""
          new_english_diag = """    englishSelectedScore: selectedEntry ? selectedEntry.score : null,
              englishConfidence: selectedEntry?.confidence?.level || '',
              englishConfidenceReason: selectedEntry?.confidence?.reason || '',
              englishScoreUplift: selectedEntry?.confidence?.scoreUplift ?? null,
              englishSelectionStable: selectedEnglish === rankedWinner,
              englishTop:"""
          if "englishConfidence:" not in text:
              if old_english_diag not in text:
                  raise SystemExit("English diagnostics guard failed")
              text = text.replace(old_english_diag, new_english_diag, 1)

          old_malay_diag = """      malaySelectedScore: rankedMalay[0] ? rankedMalay[0].score : null,
                malayTop:"""
          new_malay_diag = """      malaySelectedScore: rankedMalay[0] ? rankedMalay[0].score : null,
                nativeConfidence: rankedMalay[0]?.confidence?.level || 'NONE',
                nativeConfidenceReason: rankedMalay[0]?.confidence?.reason || 'no-native-malay',
                nativeScoreUplift: rankedMalay[0]?.confidence?.scoreUplift ?? null,
                malayTop:"""
          if "nativeConfidence:" not in text:
              if old_malay_diag not in text:
                  raise SystemExit("Malay diagnostics guard failed")
              text = text.replace(old_malay_diag, new_malay_diag, 1)

          start_marker = "    if (malay.length) {"
          end_marker = "    const resultName = auto ? 'auto-malay-ready' : english ? 'byok-not-configured' : 'no-english'"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Native Malay branch markers not found")

          replacement = """    const apiKey = options.apiKey || ''
              const auto = english && apiKey ? buildAutoSubtitle(english, options) : null

              if (malay.length) {
                const nativeSubtitles = malay.slice(0, 5).map(toNativeMalay)
                const nativeConfidence = malaySelectionDiagnostic.nativeConfidence
                const nativeStrong = nativeConfidence === 'STRONG'
                const autoFallbackOffered = Boolean(auto) && !nativeStrong
                const nativeDecision = nativeStrong
                  ? 'native-only-strong'
                  : autoFallbackOffered
                    ? 'dual-fallback'
                    : 'native-only-auto-unavailable'
                const autoPrefetch = false
                const autoPrefetchReason = nativeStrong
                  ? 'native-strong-no-auto-needed'
                  : autoFallbackOffered
                    ? 'weak-native-wait-for-user-selection'
                    : 'auto-unavailable'
                const subtitles = autoFallbackOffered
                  ? [...nativeSubtitles, auto]
                  : nativeSubtitles
                const resultName = autoFallbackOffered
                  ? 'native-malay-with-auto-fallback'
                  : 'native-malay'

                logPerf({
                  requestId,
                  milestone: 'V2-P3',
                  type: args.type,
                  id: args.id,
                  upstreamMs,
                  upstreamCount: upstream.length,
                  malayCount: malay.length,
                  ...malaySelectionDiagnostic,
                  englishFound: Boolean(english),
                  ...selectionDiagnostic,
                  nativeDecision,
                  autoFallbackOffered,
                  autoPrefetch,
                  autoPrefetchReason,
                  geminiPrefetchAvoided: true,
                  result: resultName,
                  totalMs: roundMs(nowMs() - startedAt)
                })

                await emitDiagnostic(options, {
                  event: 'subtitle-result',
                  type: args.type,
                  id: args.id,
                  result: resultName,
                  upstreamCount: upstream.length,
                  malayCount: malay.length,
                  ...malaySelectionDiagnostic,
                  englishFound: Boolean(english),
                  ...selectionDiagnostic,
                  byokConfigured: Boolean(apiKey),
                  autoReady: Boolean(autoFallbackOffered),
                  nativeDecision,
                  autoFallbackOffered,
                  autoPrefetch,
                  autoPrefetchReason,
                  geminiPrefetchAvoided: true,
                  subtitleCount: subtitles.length,
                  languages: subtitles.map(item => item.lang)
                })

                return {
                  subtitles,
                  autoPrefetch,
                  autoPrefetchReason,
                  cacheMaxAge: 120,
                  staleRevalidate: 60,
                  staleError: 600
                }
              }

          """
          text = text[:start] + replacement + text[end:]

          # Remove duplicate apiKey/auto declarations left immediately before resultName if present.
          text = text.replace(
              """    const apiKey = options.apiKey || ''
              const auto = english && apiKey ? buildAutoSubtitle(english, options) : null
              const resultName = auto ? 'auto-malay-ready' : english ? 'byok-not-configured' : 'no-english'""",
              """    const resultName = auto ? 'auto-malay-ready' : english ? 'byok-not-configured' : 'no-english'""",
              1
          )

          # Add no-native quota diagnostics and explicit aggressive prefetch policy.
          old_no_native_log = """      result: resultName,
                totalMs: roundMs(nowMs() - startedAt)"""
          new_no_native_log = """      nativeDecision: 'no-native-malay',
                autoFallbackOffered: false,
                autoPrefetch: Boolean(auto),
                autoPrefetchReason: auto ? 'no-native-malay-aggressive-prefetch' : 'auto-unavailable',
                geminiPrefetchAvoided: false,
                result: resultName,
                totalMs: roundMs(nowMs() - startedAt)"""
          if "no-native-malay-aggressive-prefetch" not in text:
              # First occurrence after the native branch is the no-native logPerf block.
              pos = text.find("    const resultName = auto ?")
              if pos < 0:
                  raise SystemExit("No-native result block not found")
              target_pos = text.find(old_no_native_log, pos)
              if target_pos < 0:
                  raise SystemExit("No-native log block guard failed")
              text = text[:target_pos] + text[target_pos:].replace(old_no_native_log, new_no_native_log, 1)

          old_no_native_diag = """      autoReady: Boolean(auto),
                subtitleCount: auto ? 1 : 0,"""
          new_no_native_diag = """      autoReady: Boolean(auto),
                nativeDecision: 'no-native-malay',
                autoFallbackOffered: false,
                autoPrefetch: Boolean(auto),
                autoPrefetchReason: auto ? 'no-native-malay-aggressive-prefetch' : 'auto-unavailable',
                geminiPrefetchAvoided: false,
                subtitleCount: auto ? 1 : 0,"""
          if new_no_native_diag not in text:
              if old_no_native_diag not in text:
                  raise SystemExit("No-native diagnostic guard failed")
              text = text.replace(old_no_native_diag, new_no_native_diag, 1)

          old_return = """      subtitles: auto ? [auto] : [],
                cacheMaxAge: auto ? 120 : 60,"""
          new_return = """      subtitles: auto ? [auto] : [],
                autoPrefetch: Boolean(auto),
                autoPrefetchReason: auto ? 'no-native-malay-aggressive-prefetch' : 'auto-unavailable',
                cacheMaxAge: auto ? 120 : 60,"""
          if "autoPrefetchReason: auto ? 'no-native-malay-aggressive-prefetch'" not in text[text.find("return {", text.find("const resultName")):]:
              if old_return not in text:
                  raise SystemExit("No-native return guard failed")
              text = text.replace(old_return, new_return, 1)

          path.write_text(text)

          # diagnostics.js
          path = Path("src/diagnostics.js")
          text = path.read_text()

          old_allowed = """    'malayCandidateCount', 'malaySelectedId', 'malaySelectedScore', 'malayTop',
              'englishFound', 'byokConfigured', 'autoReady', 'languages', 'totalMs',"""
          new_allowed = """    'malayCandidateCount', 'malaySelectedId', 'malaySelectedScore', 'malayTop',
              'nativeConfidence', 'nativeConfidenceReason', 'nativeScoreUplift', 'nativeDecision',
              'autoFallbackOffered', 'autoPrefetch', 'autoPrefetchReason', 'geminiPrefetchAvoided',
              'englishFound', 'byokConfigured', 'autoReady', 'languages', 'totalMs',
              'englishConfidence', 'englishConfidenceReason', 'englishScoreUplift',"""
          if "'nativeDecision'" not in text:
              if old_allowed not in text:
                  raise SystemExit("diagnostics allowed-list guard failed")
              text = text.replace(old_allowed, new_allowed, 1)

          # Add a friendly verdict for the dual-fallback state after active translation states.
          old_verdict_end = """  if (lastPrefetchTranslationRequest && Number(lastPrefetchTranslationRequest.ts) >= Number(lastSubtitle.ts)) return 'PREFETCH_TRANSLATING'
            if (lastSubtitle.autoReady) return 'SUBTITLE_RETURNED_WAITING_FOR_PLAYER_SELECTION'"""
          new_verdict_end = """  if (lastPrefetchTranslationRequest && Number(lastPrefetchTranslationRequest.ts) >= Number(lastSubtitle.ts)) return 'PREFETCH_TRANSLATING'
            if (lastSubtitle.result === 'native-malay-with-auto-fallback') return 'NATIVE_MALAY_WITH_AUTO_FALLBACK'
            if (lastSubtitle.autoReady) return 'SUBTITLE_RETURNED_WAITING_FOR_PLAYER_SELECTION'"""
          if "NATIVE_MALAY_WITH_AUTO_FALLBACK" not in text:
              if old_verdict_end not in text:
                  raise SystemExit("deriveVerdict guard failed")
              text = text.replace(old_verdict_end, new_verdict_end, 1)

          path.write_text(text)

          # cloudflare-worker.mjs
          path = Path("src/cloudflare-worker.mjs")
          text = path.read_text()

          # Friendly verdict presentation.
          old_map = """    NATIVE_MALAY_RETURNED: ['Native Malay returned', 'good', 'SmartSubsV2 returned an existing Malay subtitle without Gemini translation.'],"""
          new_map = """    NATIVE_MALAY_RETURNED: ['Native Malay returned', 'good', 'SmartSubsV2 returned an existing Malay subtitle without Gemini translation.'],
              NATIVE_MALAY_WITH_AUTO_FALLBACK: ['Native Malay + Auto fallback', 'warn', 'Native Malay sync evidence is weak. Malay Auto is available, but Gemini is not used unless you select it.'],"""
          if "NATIVE_MALAY_WITH_AUTO_FALLBACK:" not in text:
              if old_map not in text:
                  raise SystemExit("verdictPresentation guard failed")
              text = text.replace(old_map, new_map, 1)

          # Add native decision information to the friendly dashboard.
          state_anchor = """  const wallTime = lastTranslationComplete?.translationWallMs
            const topCandidates = ranked.length"""
          state_new = """  const wallTime = lastTranslationComplete?.translationWallMs
            const nativeConfidence = lastSubtitle?.nativeConfidence || (Number(lastSubtitle?.malayCount || 0) > 0 ? 'UNKNOWN' : 'NONE')
            const nativeDecision = lastSubtitle?.nativeDecision || 'Not applicable'
            const nativeId = lastSubtitle?.malaySelectedId || 'Not available'
            const nativeScore = Number(lastSubtitle?.malaySelectedScore)
            const topCandidates = ranked.length"""
          if "const nativeDecision = lastSubtitle?.nativeDecision" not in text:
              if state_anchor not in text:
                  raise SystemExit("friendly diagnose state guard failed")
              text = text.replace(state_anchor, state_new, 1)

          # Prioritise quota-safe fallback explanation.
          guidance_anchor = """  if (lastSubtitle) {
              if (sync.tone === 'bad') {"""
          guidance_new = """  if (lastSubtitle) {
              if (lastSubtitle.nativeDecision === 'dual-fallback') {
                guidance = 'Native Malay sync evidence is weak. Try Native Malay first. Malay Auto is available as a fallback, and Gemini translation starts only if you select Malay Auto.'
              } else if (sync.tone === 'bad') {"""
          if "Try Native Malay first" not in text:
              if guidance_anchor not in text:
                  raise SystemExit("friendly diagnose guidance guard failed")
              text = text.replace(guidance_anchor, guidance_new, 1)

          quick_anchor = """<div class="metric"><div class="label">Subtitle result</div><div class="value">${escapeHtml(lastSubtitle?.result || 'Not available')}</div><div class="sub">${escapeHtml(lastSubtitle ? `${lastSubtitle.subtitleCount || 0} returned | ${lastSubtitle.languages || 'language unknown'}` : '')}</div></div>
          <div class="metric"><div class="label">Selected English source</div>"""
          quick_new = """<div class="metric"><div class="label">Subtitle result</div><div class="value">${escapeHtml(lastSubtitle?.result || 'Not available')}</div><div class="sub">${escapeHtml(lastSubtitle ? `${lastSubtitle.subtitleCount || 0} returned | ${lastSubtitle.languages || 'language unknown'}` : '')}</div></div>
          <div class="metric"><div class="label">Native Malay decision</div><div class="value">${escapeHtml(nativeDecision)}</div><div class="sub">source ${escapeHtml(nativeId)} | confidence ${escapeHtml(nativeConfidence)}${Number.isFinite(nativeScore) ? ` | score ${escapeHtml(nativeScore)}` : ''}</div></div>
          <div class="metric"><div class="label">Selected English source</div>"""
          if "Native Malay decision" not in text:
              if quick_anchor not in text:
                  raise SystemExit("friendly diagnose quick-card guard failed")
              text = text.replace(quick_anchor, quick_new, 1)

          # Keep new verdict in the collapsed reference list.
          ref_anchor = "<span><code>NO_ENGLISH_SOURCE_FOUND</code></span>"
          if "NATIVE_MALAY_WITH_AUTO_FALLBACK</code>" not in text:
              if ref_anchor not in text:
                  raise SystemExit("verdict reference guard failed")
              text = text.replace(
                  ref_anchor,
                  ref_anchor + "<span><code>NATIVE_MALAY_WITH_AUTO_FALLBACK</code></span>",
                  1
              )

          # Add policy helper immediately before configuredRequest.
          worker_anchor = "async function configuredRequest(request, env, token, suffix, executionCtx = null) {"
          worker_helper = """function shouldPrefetchAutoResult(result, autoUrl) {
            return Boolean(autoUrl) && result?.autoPrefetch !== false
          }

          """
          if "function shouldPrefetchAutoResult(" not in text:
              if worker_anchor not in text:
                  raise SystemExit("worker helper anchor failed")
              text = text.replace(worker_anchor, worker_helper + worker_anchor, 1)

          old_prefetch = """      if (autoUrl) {
                  const translationToken = parseAutoTranslationToken(autoUrl)"""
          new_prefetch = """      if (autoUrl && result?.autoPrefetch === false) {
                  await recordDiagnostic(env.SMARTSUBS_CACHE, configId, {
                    event: 'auto-prefetch-skipped',
                    status: 'quota-protected',
                    reason: result.autoPrefetchReason || 'user-selection-required'
                  }).catch(() => {})
                }

                if (shouldPrefetchAutoResult(result, autoUrl)) {
                  const translationToken = parseAutoTranslationToken(autoUrl)"""
          if "event: 'auto-prefetch-skipped'" not in text:
              if old_prefetch not in text:
                  raise SystemExit("worker prefetch guard failed")
              text = text.replace(old_prefetch, new_prefetch, 1)

          # Export helper for focused regression testing.
          old_exports = "rateLimitAllowed, rateLimitedResponse, publicReady }"
          new_exports = "rateLimitAllowed, rateLimitedResponse, publicReady, shouldPrefetchAutoResult }"
          if "shouldPrefetchAutoResult }" not in text:
              if old_exports not in text:
                  raise SystemExit("worker export guard failed")
              text = text.replace(old_exports, new_exports, 1)

          path.write_text(text)
          PY

      - name: Add Part 3 regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > test/v2-part3-native-safe-fallback.test.js <<'TEST'
          'use strict'

          const test = require('node:test')
          const assert = require('node:assert/strict')

          const {
            subtitleMatchConfidence,
            rankMalaySubtitles
          } = require('../src/selector')
          const { handleSubtitles } = require('../src/subtitles')
          const { sanitiseEvent, deriveVerdict } = require('../src/diagnostics')

          function responseFor(subtitles) {
            return async () => ({
              ok: true,
              status: 200,
              json: async () => ({ subtitles })
            })
          }

          test('Part 3 treats base-score native Malay as weak sync evidence', () => {
            const subtitle = {
              id: 'native-only',
              lang: 'ms',
              url: 'https://example.test/native.srt'
            }

            const info = subtitleMatchConfidence(subtitle, 0, {
              filename: 'Ted Lasso Season 1 (2020) S01E01-onetouchtv'
            }, 10020)

            assert.equal(info.level, 'WEAK')
            assert.equal(info.reason, 'insufficient-sync-evidence')
            assert.equal(info.scoreUplift, 20)
          })

          test('Part 3 recognises strong native release evidence', () => {
            const candidates = [{
              id: 'native-match',
              lang: 'ms',
              url: 'https://example.test/Show.S01E01.1080p.WEB-DL.x265-GROUP.srt'
            }]

            const ranked = rankMalaySubtitles(candidates, {
              filename: 'Show.S01E01.1080p.WEB-DL.x265-GROUP.mkv'
            })

            assert.equal(ranked[0].confidence.level, 'STRONG')
            assert.ok(ranked[0].confidence.scoreUplift >= 700)
          })

          test('Part 3 weak native Malay offers Auto without prefetching Gemini', async () => {
            const upstream = [
              {
                id: 'native-weak',
                lang: 'ms',
                url: 'https://example.test/native.srt'
              },
              {
                id: 'english-weak',
                lang: 'eng',
                url: 'https://example.test/english.srt'
              }
            ]

            const events = []
            const result = await handleSubtitles({
              type: 'series',
              id: 'tt10986410:1:1',
              extra: { filename: 'Ted Lasso Season 1 (2020) S01E01-onetouchtv' }
            }, {
              apiKey: 'test-key',
              publicBaseUrl: 'https://smartsubsv2.example/c/test',
              tokenSecret: 'test-secret',
              fetchImpl: responseFor(upstream),
              onDiagnostic: async event => events.push(event)
            })

            assert.equal(result.subtitles.length, 2)
            assert.equal(result.subtitles[0].id, 'native-weak')
            assert.match(result.subtitles[1].id, /^smartsubs-auto-/)
            assert.equal(result.autoPrefetch, false)
            assert.equal(result.autoPrefetchReason, 'weak-native-wait-for-user-selection')

            const event = events.find(item => item.event === 'subtitle-result')
            assert.ok(event)
            assert.equal(event.result, 'native-malay-with-auto-fallback')
            assert.equal(event.nativeConfidence, 'WEAK')
            assert.equal(event.nativeDecision, 'dual-fallback')
            assert.equal(event.autoFallbackOffered, true)
            assert.equal(event.autoPrefetch, false)
            assert.equal(event.geminiPrefetchAvoided, true)
          })

          test('Part 3 strong native Malay stays native-only and uses zero Auto fallback', async () => {
            const upstream = [
              {
                id: 'native-strong',
                lang: 'ms',
                url: 'https://example.test/Show.S01E01.1080p.WEB-DL.x265-GROUP.srt'
              },
              {
                id: 'english',
                lang: 'eng',
                url: 'https://example.test/Show.S01E01.1080p.WEB-DL.x265-GROUP.en.srt'
              }
            ]

            const events = []
            const result = await handleSubtitles({
              type: 'series',
              id: 'tt123:1:1',
              extra: { filename: 'Show.S01E01.1080p.WEB-DL.x265-GROUP.mkv' }
            }, {
              apiKey: 'test-key',
              publicBaseUrl: 'https://smartsubsv2.example/c/test',
              tokenSecret: 'test-secret',
              fetchImpl: responseFor(upstream),
              onDiagnostic: async event => events.push(event)
            })

            assert.equal(result.subtitles.length, 1)
            assert.equal(result.subtitles[0].id, 'native-strong')
            assert.equal(result.autoPrefetch, false)

            const event = events.find(item => item.event === 'subtitle-result')
            assert.equal(event.result, 'native-malay')
            assert.equal(event.nativeConfidence, 'STRONG')
            assert.equal(event.nativeDecision, 'native-only-strong')
            assert.equal(event.autoFallbackOffered, false)
            assert.equal(event.geminiPrefetchAvoided, true)
          })

          test('Part 3 no-native path keeps aggressive Auto prefetch', async () => {
            const upstream = [{
              id: 'english-only',
              lang: 'eng',
              url: 'https://example.test/english.srt'
            }]

            const events = []
            const result = await handleSubtitles({
              type: 'movie',
              id: 'tt1375666',
              extra: {}
            }, {
              apiKey: 'test-key',
              publicBaseUrl: 'https://smartsubsv2.example/c/test',
              tokenSecret: 'test-secret',
              fetchImpl: responseFor(upstream),
              onDiagnostic: async event => events.push(event)
            })

            assert.equal(result.subtitles.length, 1)
            assert.equal(result.autoPrefetch, true)
            assert.equal(result.autoPrefetchReason, 'no-native-malay-aggressive-prefetch')

            const event = events.find(item => item.event === 'subtitle-result')
            assert.equal(event.nativeDecision, 'no-native-malay')
            assert.equal(event.autoPrefetch, true)
            assert.equal(event.geminiPrefetchAvoided, false)
          })

          test('Part 3 diagnose sanitizer preserves quota and native confidence decisions', () => {
            const clean = sanitiseEvent({
              event: 'subtitle-result',
              nativeConfidence: 'WEAK',
              nativeConfidenceReason: 'insufficient-sync-evidence',
              nativeScoreUplift: 20,
              nativeDecision: 'dual-fallback',
              autoFallbackOffered: true,
              autoPrefetch: false,
              autoPrefetchReason: 'weak-native-wait-for-user-selection',
              geminiPrefetchAvoided: true,
              englishConfidence: 'WEAK',
              englishConfidenceReason: 'insufficient-sync-evidence',
              englishScoreUplift: 20
            })

            assert.equal(clean.nativeConfidence, 'WEAK')
            assert.equal(clean.nativeDecision, 'dual-fallback')
            assert.equal(clean.autoFallbackOffered, true)
            assert.equal(clean.autoPrefetch, false)
            assert.equal(clean.geminiPrefetchAvoided, true)
            assert.equal(clean.englishConfidence, 'WEAK')
          })

          test('Part 3 dual fallback has a dedicated diagnose verdict', () => {
            const verdict = deriveVerdict([{
              ts: Date.now(),
              event: 'subtitle-result',
              result: 'native-malay-with-auto-fallback',
              subtitleCount: 2,
              autoReady: true
            }])

            assert.equal(verdict, 'NATIVE_MALAY_WITH_AUTO_FALLBACK')
          })

          test('Part 3 worker prefetch policy protects Gemini on weak native fallback', async () => {
            const { shouldPrefetchAutoResult } = await import('../src/cloudflare-worker.mjs')

            assert.equal(
              shouldPrefetchAutoResult(
                { autoPrefetch: false },
                'https://smartsubsv2.example/c/test/translated/token.vtt'
              ),
              false
            )

            assert.equal(
              shouldPrefetchAutoResult(
                { autoPrefetch: true },
                'https://smartsubsv2.example/c/test/translated/token.vtt'
              ),
              true
            )
          })
          TEST

      - name: Add Part 3 notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/V2_PART3_NATIVE_SAFE_FALLBACK.md <<'DOC'
          # SmartSubsV2 Part 3: Native Malay Safe Fallback

          Part 3 protects both sync quality and Gemini quota.

          ## Decision policy

          ### Native Malay with strong sync evidence

          SmartSubsV2 returns native Malay only.

          No Malay Auto fallback is added and Gemini is not prefetched.

          ### Native Malay with weak or limited sync evidence

          SmartSubsV2 returns native Malay first and Malay Auto as a fallback.

          Malay Auto is NOT prefetched. Gemini translation starts only if the player requests the translated VTT, which normally means the user selected Malay Auto.

          This prevents every weak native Malay result from automatically consuming Gemini quota.

          ### No native Malay

          Existing behaviour stays unchanged.

          SmartSubsV2 returns Malay Auto and continues aggressive Queue pretranslation so the translated subtitle can be ready as early as possible.

          ## Confidence rule

          The current source score is converted into confidence based on evidence rather than absolute order:

          - exact video hash: STRONG
          - exact video size: STRONG
          - score uplift of at least 700 from release matching: STRONG
          - score uplift of 250 to 699: LIMITED
          - lower uplift: WEAK

          A result such as score `10020` at rank 1 has only a `20` point uplift and is therefore WEAK, even though it is the best available candidate.

          ## Diagnose fields

          Part 3 adds and preserves:

          - nativeConfidence
          - nativeConfidenceReason
          - nativeScoreUplift
          - nativeDecision
          - autoFallbackOffered
          - autoPrefetch
          - autoPrefetchReason
          - geminiPrefetchAvoided
          - englishConfidence
          - englishConfidenceReason
          - englishScoreUplift

          The friendly Diagnose dashboard also shows the Native Malay decision directly.

          All previous raw diagnostic events, Malaysia time display, English source details, cache, Queue, Gemini and performance diagnostics remain intact.
          DOC

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused Part 3 tests
        run: node --test test/v2-part3-native-safe-fallback.test.js

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          git diff --check

      - name: Verify patch scope and quota policy
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "function subtitleMatchConfidence" src/selector.js
          grep -Fq "native-malay-with-auto-fallback" src/subtitles.js
          grep -Fq "weak-native-wait-for-user-selection" src/subtitles.js
          grep -Fq "'nativeDecision'" src/diagnostics.js
          grep -Fq "function shouldPrefetchAutoResult" src/cloudflare-worker.mjs
          grep -Fq "auto-prefetch-skipped" src/cloudflare-worker.mjs
          grep -Fq "Native Malay decision" src/cloudflare-worker.mjs

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(src/selector\.js|src/subtitles\.js|src/diagnostics\.js|src/cloudflare-worker\.mjs|test/v2-part3-native-safe-fallback\.test\.js|docs/V2_PART3_NATIVE_SAFE_FALLBACK\.md)$' || true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified Part 3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/selector.js \
            src/subtitles.js \
            src/diagnostics.js \
            src/cloudflare-worker.mjs \
            test/v2-part3-native-safe-fallback.test.js \
            docs/V2_PART3_NATIVE_SAFE_FALLBACK.md

          if git diff --cached --quiet; then
            echo "Part 3 is already applied."
            exit 0
          fi

          git commit -m "Add quota-safe native Malay fallback"
          git push origin HEAD:main
