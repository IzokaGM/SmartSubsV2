name: SmartSubsV2 - Part 5.1 SubSource Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part5-1-subsource-discovery
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify SmartSubsV2 target and baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected_hashes = json.loads(r'''{
            "README.md": "a402c07c442925816fb16e00af7a59a9a65457b2ddd4d549abf88d05a0bccedd",
            "src/cloudflare-worker.mjs": "fd45368751e4493591de2a9d15e91e51240e17cd836ead6dd28f603a5978d3fe",
            "src/configure.js": "68e3a29c1c81e7de7a510fa40b834ec72c17ee5ae57c511eed134110d17cdfb9",
            "src/diagnostics.js": "84f7eb50cea01adc53c424fa2199e95b1893244dc073ddafac5045167a87000c",
            "src/user-config.js": "107e7ff5610c391f2456fac6fc1c6c4fd295241ff3aeae986053c218cd4141b2",
            "test/nuvio-worker.test.js": "29eb1ff39685660e4731496ed41a74dddf1deec2d24cb8f96e7e15895c89d521"
          }''')
          new_paths = json.loads(r'''[
            "docs/PART5-1_SUBSOURCE_DISCOVERY.md",
            "src/subsource.js",
            "test/v2-part5-1-subsource-discovery.test.js"
          ]''')

          manifest = Path('src/manifest.js').read_text()
          wrangler = Path('wrangler.jsonc').read_text()
          if "id: 'community.smartsubsv2'" not in manifest or "name: 'SmartSubsV2'" not in manifest:
              raise SystemExit('This workflow must run in the SmartSubsV2 repository')
          if '"name": "smartsubsv2"' not in wrangler:
              raise SystemExit('SmartSubsV2 Worker identity was not found')
          if '"queue": "smartsubsv2-translation"' not in wrangler:
              raise SystemExit('SmartSubsV2 Queue identity was not found')

          already_applied = all([
              Path('src/subsource.js').exists(),
              Path('test/v2-part5-1-subsource-discovery.test.js').exists(),
              "const BUILD_ID = 'part5-1-subsource-discovery'" in Path('src/cloudflare-worker.mjs').read_text(),
              'subsourceApiKey' in Path('src/user-config.js').read_text(),
          ])

          if not already_applied:
              for relative, expected in expected_hashes.items():
                  path = Path(relative)
                  if not path.is_file():
                      raise SystemExit(f'Baseline file is missing: {relative}')
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(
                          f'Baseline changed for {relative}. Expected {expected}, got {actual}'
                      )
              unexpected_existing = [relative for relative in new_paths if Path(relative).exists()]
              if unexpected_existing:
                  raise SystemExit(
                      'Files expected to be new already exist: ' + ', '.join(unexpected_existing)
                  )
          PY

      - name: Apply Part 5.1 SubSource discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          from pathlib import Path

          payloads = json.loads(r'''{
            "README.md": "",
            "docs/PART5-1_SUBSOURCE_DISCOVERY.md": "",
            "src/cloudflare-worker.mjs": "",
            "src/configure.js": "",
            "src/diagnostics.js": "",
            "src/subsource.js": "",
            "src/user-config.js": "",
            "test/nuvio-worker.test.js": "",
            "test/v2-part5-1-subsource-discovery.test.js": ""
          }''')
          for relative, encoded in payloads.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify Part 5.1 safety and scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "id: 'community.smartsubsv2'" src/manifest.js
          grep -Fq '"name": "smartsubsv2"' wrangler.jsonc
          grep -Fq '"queue": "smartsubsv2-translation"' wrangler.jsonc
          grep -Fq "const BUILD_ID = 'part5-1-subsource-discovery'" src/cloudflare-worker.mjs
          grep -Fq "https://api.subsource.net/api/v1" src/subsource.js
          grep -Fq "'x-api-key': key" src/subsource.js
          grep -Fq "SubSource API key (optional)" src/configure.js
          grep -Fq "Part 5.1 never adds, removes, reorders, downloads, or translates a SubSource subtitle" docs/PART5-1_SUBSOURCE_DISCOVERY.md

          if grep -R -n -E 'subsourceApiKey.*(console|logPerf|Queue|queue)|[?&](api_?key|key)=.*subsource' src; then
            echo "Potential SubSource key exposure was detected."
            exit 1
          fi

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(\.github/workflows/smartsubsv2\-part5\-1\-subsource\-discovery\.yml|README\.md|docs/PART5\-1_SUBSOURCE_DISCOVERY\.md|src/cloudflare\-worker\.mjs|src/configure\.js|src/diagnostics\.js|src/subsource\.js|src/user\-config\.js|test/nuvio\-worker\.test\.js|test/v2\-part5\-1\-subsource\-discovery\.test\.js)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run focused Part 5.1 tests
        run: node --test test/v2-part5-1-subsource-discovery.test.js test/nuvio-worker.test.js

      - name: Run syntax and full regression suite
        run: |
          npm run check
          npm test

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/smartsubsv2-part5-1-build

      - name: Commit verified Part 5.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/smartsubsv2-part5-1-subsource-discovery.yml \
            README.md \
            docs/PART5-1_SUBSOURCE_DISCOVERY.md \
            src/cloudflare-worker.mjs \
            src/configure.js \
            src/diagnostics.js \
            src/subsource.js \
            src/user-config.js \
            test/nuvio-worker.test.js \
            test/v2-part5-1-subsource-discovery.test.js

          if git diff --cached --quiet; then
            echo "Part 5.1 is already applied."
            exit 0
          fi

          git commit -m "Add optional SubSource discovery"
          git push origin HEAD:main
