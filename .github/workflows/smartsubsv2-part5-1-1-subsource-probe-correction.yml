name: SmartSubsV2 - Part 5.1.1 SubSource Probe Correction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part5-1-1-subsource-probe-correction
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify SmartSubsV2 target and baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected_hashes = json.loads(r'''{
            "README.md": "aa337e38d3cd77a3b08e300078d6e3f4a4f792d94ed1d66f541903ed5b571a9b",
            "docs/PART5-1_SUBSOURCE_DISCOVERY.md": "103b204bf3d8a8ae9aaa4c5999c32f59518bc68495a8188163189529ab87ad4c",
            "src/cloudflare-worker.mjs": "013ba91afee3a81fce84738cb338ea1b5e2071ea5ae1af4d03cfa84cfb8e6e59",
            "src/diagnostics.js": "01c86ddd8c5637244b2e855e4f94c340509976a42029b31900f1bb7ccc6f129b",
            "src/subsource.js": "ff8d5d42009c737995c5eb0bdc63825150fb8464e90fb6373c9b4ac1f7b4b986",
            "test/nuvio-worker.test.js": "eb560be3fa6abcebcf0274f1bee50baae70fcdd4406df90a941c20d644cda869",
            "test/v2-part5-1-subsource-discovery.test.js": "26099f2da0d09f72f68fda8db48521466e9e20dc0654020aa74ba1baac70bf72"
          }''')
          new_paths = json.loads(r'''[]''')

          manifest = Path('src/manifest.js').read_text()
          wrangler = Path('wrangler.jsonc').read_text()
          if "id: 'community.smartsubsv2'" not in manifest or "name: 'SmartSubsV2'" not in manifest:
              raise SystemExit('This workflow must run in the SmartSubsV2 repository')
          if '"name": "smartsubsv2"' not in wrangler:
              raise SystemExit('SmartSubsV2 Worker identity was not found')
          if '"queue": "smartsubsv2-translation"' not in wrangler:
              raise SystemExit('SmartSubsV2 Queue identity was not found')

          already_applied = all([
              "const BUILD_ID = 'part5-1-1-subsource-probe-correction'" in Path('src/cloudflare-worker.mjs').read_text(),
              'const PROBE_VERSION = 2' in Path('src/subsource.js').read_text(),
              '/movies/search?searchType=text&q=' in Path('src/subsource.js').read_text(),
          ])

          if not already_applied:
              for relative, expected in expected_hashes.items():
                  path = Path(relative)
                  if not path.is_file():
                      raise SystemExit(f'Baseline file is missing: {relative}')
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(
                          f'Baseline changed for {relative}. Expected {expected}, got {actual}'
                      )
              unexpected_existing = [relative for relative in new_paths if Path(relative).exists()]
              if unexpected_existing:
                  raise SystemExit(
                      'Files expected to be new already exist: ' + ', '.join(unexpected_existing)
                  )
          PY

      - name: Apply Part 5.1.1 SubSource probe correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          from pathlib import Path

          payloads = json.loads(r'''{
            "README.md": "",
            "docs/PART5-1_SUBSOURCE_DISCOVERY.md": "",
            "src/cloudflare-worker.mjs": "",
            "src/diagnostics.js": "",
            "src/subsource.js": "",
            "test/nuvio-worker.test.js": "",
            "test/v2-part5-1-subsource-discovery.test.js": ""
          }''')
          for relative, encoded in payloads.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify Part 5.1.1 safety and scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "id: 'community.smartsubsv2'" src/manifest.js
          grep -Fq '"name": "smartsubsv2"' wrangler.jsonc
          grep -Fq '"queue": "smartsubsv2-translation"' wrangler.jsonc
          grep -Fq "const BUILD_ID = 'part5-1-1-subsource-probe-correction'" src/cloudflare-worker.mjs
          grep -Fq "https://api.subsource.net/api/v1" src/subsource.js
          grep -Fq "const PROBE_VERSION = 2" src/subsource.js
          grep -Fq "/movies/search?searchType=text&q=" src/subsource.js
          grep -Fq "searchType=text" docs/PART5-1_SUBSOURCE_DISCOVERY.md
          grep -Fq "'x-api-key': key" src/subsource.js
          grep -Fq "Part 5.1 never adds, removes, reorders, downloads, or translates a SubSource subtitle" docs/PART5-1_SUBSOURCE_DISCOVERY.md

          if grep -R -n -E 'subsourceApiKey.*(console|logPerf|Queue|queue)|[?&](api_?key|key)=.*subsource' src; then
            echo "Potential SubSource key exposure was detected."
            exit 1
          fi

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(\.github/workflows/smartsubsv2\-part5\-1\-1\-subsource\-probe\-correction\.yml|README\.md|docs/PART5\-1_SUBSOURCE_DISCOVERY\.md|src/cloudflare\-worker\.mjs|src/diagnostics\.js|src/subsource\.js|test/nuvio\-worker\.test\.js|test/v2\-part5\-1\-subsource\-discovery\.test\.js)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run focused Part 5.1.1 tests
        run: node --test test/v2-part5-1-subsource-discovery.test.js test/nuvio-worker.test.js

      - name: Run syntax and full regression suite
        run: |
          npm run check
          npm test

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/smartsubsv2-part5-1-1-build

      - name: Commit verified Part 5.1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/smartsubsv2-part5-1-1-subsource-probe-correction.yml \
            README.md \
            docs/PART5-1_SUBSOURCE_DISCOVERY.md \
            src/cloudflare-worker.mjs \
            src/diagnostics.js \
            src/subsource.js \
            test/nuvio-worker.test.js \
            test/v2-part5-1-subsource-discovery.test.js

          if git diff --cached --quiet; then
            echo "Part 5.1.1 is already applied."
            exit 0
          fi

          git commit -m "Correct SubSource discovery probe"
          git push origin HEAD:main
