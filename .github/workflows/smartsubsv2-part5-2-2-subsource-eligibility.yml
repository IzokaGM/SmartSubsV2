name: SmartSubsV2 Part 5.2.2 - SubSource Eligibility Gate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part5-2-2-subsource-eligibility
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify exact Part 5.2.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "part5-2-2-subsource-eligibility-gate" src/cloudflare-worker.mjs; then
            echo "Part 5.2.2 is already present. No files were changed."
            exit 1
          fi
          sha256sum -c <<'HASHES'
          1852ce0359a105a93ce0bae6712d47fabcd9851e9405eb33404a20333bb3b6e9  src/cloudflare-worker.mjs
          e266ac45d38de2953c45342db4287555558fa1c778816922248131132898921a  src/diagnostics.js
          f514ae68d104bbc62f9a514d8ac35a6d6db974ff2e35f5b58c30a4b76172d3d8  src/subtitles.js
          793d31d02bb25dbdf3a68ade2fe97846e02764f3be52d5ff012717f84b72f80c  test/nuvio-worker.test.js
          HASHES
          test ! -e test/v2-part5-2-2-subsource-eligibility.test.js
          grep -Fq "part5-2-1-subsource-native-safety" src/cloudflare-worker.mjs
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

      - name: Apply Part 5.2.2 exact payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<'PAYLOAD' | gzip -d > /tmp/smartsubsv2-part5-2-2.patch
          
          PAYLOAD
          git apply --check /tmp/smartsubsv2-part5-2-2.patch
          git apply /tmp/smartsubsv2-part5-2-2.patch

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused Part 5.2 safety tests
        run: node --test test/v2-part5-2-subsource-fusion.test.js test/v2-part5-2-1-subsource-native-safety.test.js test/v2-part5-2-2-subsource-eligibility.test.js

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          git diff --check

      - name: Verify safety and stable runtime settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "part5-2-2-subsource-eligibility-gate" src/cloudflare-worker.mjs
          grep -Fq "skipped-no-sync-metadata" src/subtitles.js
          grep -Fq "hasPlayerSyncMetadata" src/subtitles.js
          grep -Fq "Only strong release and exact series episode matches are admitted" src/cloudflare-worker.mjs
          grep -Fq "OpenSubtitles remains the permanent fallback" src/cloudflare-worker.mjs
          grep -Fq "queueProfile: 'user-selected-stable'" src/cloudflare-worker.mjs
          grep -Fq "JSON.stringify({ v: 1" src/token.js
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(src/cloudflare-worker\.mjs|src/diagnostics\.js|src/subtitles\.js|test/nuvio-worker\.test\.js|test/v2-part5-2-2-subsource-eligibility\.test\.js)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          if rg -n "subsourceApiKey.*(url|query)|[?&](apiKey|key)=" src --glob '!configure.js'; then
            echo "Potential SubSource key exposure path detected."
            exit 1
          fi

      - name: Cloudflare Worker dry run
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir .cf-build

      - name: Commit verified Part 5.2.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloudflare-worker.mjs src/diagnostics.js src/subtitles.js \
            test/nuvio-worker.test.js test/v2-part5-2-2-subsource-eligibility.test.js
          git commit -m "Skip SubSource without sync metadata"
          git push origin HEAD:main

