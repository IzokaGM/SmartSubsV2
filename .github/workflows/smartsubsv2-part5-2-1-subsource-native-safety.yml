name: SmartSubsV2 Part 5.2.1 - SubSource Native Safety

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part5-2-1-subsource-native-safety
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify exact Part 5.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "part5-2-1-subsource-native-safety" src/cloudflare-worker.mjs; then
            echo "Part 5.2.1 is already present. No files were changed."
            exit 1
          fi
          sha256sum -c <<'HASHES'
          799c69599026e47ea9ae96a29791223d6f7adcf80e5f4bd1c423c0532a1c4088  src/cloudflare-worker.mjs
          417b83ae94c49848ca34bd420148b005ea4398dda7d055a026190685e4b7b59e  src/diagnostics.js
          51499a97d0e9ba3e81fea1154a9487b44db4b6265083ab7d882e4c988cd46c98  src/subsource-archive.js
          c587bdb3be89112c7ea82e943037963849b05e36699dba2c77db3419121c59b2  src/subsource.js
          7c496faf5d4121ea8f3e92062bf9ba5d6d0f604827ae39c78053d570df24b56a  src/subtitles.js
          f4efec4452c4c6d00314fff5f7d2fd35a6cb57c74095538bc4bdbe988eaee469  test/nuvio-worker.test.js
          beb4e42698d1daaa156263307d08f9effc3531f05abc8862f46e035bec3dc149  test/v2-part5-2-subsource-fusion.test.js
          HASHES
          test ! -e test/v2-part5-2-1-subsource-native-safety.test.js
          grep -Fq "part5-2-final-subsource-fusion" src/cloudflare-worker.mjs
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

      - name: Apply Part 5.2.1 exact payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<'PAYLOAD' | gzip -d > /tmp/smartsubsv2-part5-2-1.patch
          
          PAYLOAD
          git apply --check /tmp/smartsubsv2-part5-2-1.patch
          git apply /tmp/smartsubsv2-part5-2-1.patch

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused Part 5.2.1 safety tests
        run: node --test test/v2-part5-2-subsource-fusion.test.js test/v2-part5-2-1-subsource-native-safety.test.js

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          git diff --check

      - name: Verify safety and stable runtime settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "part5-2-1-subsource-native-safety" src/cloudflare-worker.mjs
          grep -Fq "Only strong release and exact series episode matches are admitted" src/cloudflare-worker.mjs
          grep -Fq "OpenSubtitles remains the permanent fallback" src/cloudflare-worker.mjs
          grep -Fq "seriesReleaseMatches" src/subtitles.js
          grep -Fq "subsourceRejectedCount" src/diagnostics.js
          grep -Fq "subsource:file:v2:" src/cloudflare-worker.mjs
          grep -Fq "queueProfile: 'user-selected-stable'" src/cloudflare-worker.mjs
          grep -Fq "JSON.stringify({ v: 1" src/token.js
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(src/cloudflare-worker\.mjs|src/diagnostics\.js|src/subsource-archive\.js|src/subsource\.js|src/subtitles\.js|test/nuvio-worker\.test\.js|test/v2-part5-2-subsource-fusion\.test\.js|test/v2-part5-2-1-subsource-native-safety\.test\.js)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          if rg -n "subsourceApiKey.*(url|query)|[?&](apiKey|key)=" src --glob '!configure.js'; then
            echo "Potential SubSource key exposure path detected."
            exit 1
          fi

      - name: Cloudflare Worker dry run
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir .cf-build

      - name: Commit verified Part 5.2.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloudflare-worker.mjs src/diagnostics.js src/subsource-archive.js src/subsource.js src/subtitles.js \
            test/nuvio-worker.test.js test/v2-part5-2-subsource-fusion.test.js \
            test/v2-part5-2-1-subsource-native-safety.test.js
          git commit -m "Reject unsafe SubSource episode matches"
          git push origin HEAD:main

