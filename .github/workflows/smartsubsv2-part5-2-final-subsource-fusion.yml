name: SmartSubsV2 Part 5.2 - Final Adaptive SubSource Fusion

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubsv2-part5-2-final-subsource-fusion
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SmartSubsV2
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify exact Part 5.1.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "part5-2-final-subsource-fusion" src/cloudflare-worker.mjs; then
            echo "Part 5.2 is already present. No files were changed."
            exit 1
          fi
          sha256sum -c <<'HASHES'
          0a0b252221cfb0b47c74c0671f85536ebf7e9aad9ce63a936991b418d224bda7  package.json
          8511f1cd2c70792f6dd6f92233c11aeb03dcd7e7b78996f8aa99753cdc55c5c8  package-lock.json
          03c3b9028b095b3f9210d34668b6e4eb495c176d822413a4b2141a8f39b6dac6  README.md
          81994b58eb07532c66ae244b4754a89637eb1d1d44d14bea2db091afd84bb28f  src/cloudflare-worker.mjs
          70206d0e881e409eb1562b243e559541a59660b237a3e89e4c2a374d82c133fe  src/configure.js
          d44dbc9a171d66ddb0bc85ee0f5bf859acc99df43f3c2fa1709222d44069a0ea  src/diagnostics.js
          603c1e944c86a47e9ffa4aff3dde525d285c267c40fc21b978ef1a85f1552ea0  src/subsource.js
          67c523eb037d3cc91a74e73b740bee2d18102bc605e1bac2476edf408324e427  src/selector.js
          0742013d7ed3f74d8a6e890b40762b12eb5de144adab3d590295fea89a0d0b59  src/subtitles.js
          9747460091704fcb021cb275b2cb0b5a380b63d39b7fb6c110ce8dd004c78684  test/nuvio-worker.test.js
          8a19f5f7e0a36c74d6c3bc57cf0d236900e935cabf527ab9b262194e87e57a49  test/v2-part5-1-subsource-discovery.test.js
          HASHES
          test ! -e src/subsource-archive.js
          test ! -e test/v2-part5-2-subsource-fusion.test.js
          test ! -e docs/PART5-2_SUBSOURCE_FUSION.md
          grep -Fq "part5-1-1-subsource-probe-correction" src/cloudflare-worker.mjs
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

      - name: Apply Part 5.2 exact payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<'PAYLOAD' | gzip -d > /tmp/smartsubsv2-part5-2.patch
          
          PAYLOAD
          git apply --check /tmp/smartsubsv2-part5-2.patch
          git apply /tmp/smartsubsv2-part5-2.patch

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused Part 5.2 tests
        run: node --test test/v2-part5-2-subsource-fusion.test.js

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          git diff --check

      - name: Verify safety and stable runtime settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "part5-2-final-subsource-fusion" src/cloudflare-worker.mjs
          grep -Fq "subsourceFusion: true" src/cloudflare-worker.mjs
          grep -Fq "OpenSubtitles remains the permanent fallback" src/cloudflare-worker.mjs
          grep -Fq "x-api-key" src/subsource.js
          grep -Fq "extractSubtitleArchive" src/subsource-archive.js
          grep -Fq "queueProfile: 'user-selected-stable'" src/cloudflare-worker.mjs
          grep -Fq "JSON.stringify({ v: 1" src/token.js
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc
          grep -Fq '"QUEUE_USER_SELECTED_CONCURRENCY": "3"' wrangler.jsonc
          grep -Fq '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(README\.md|package-lock\.json|package\.json|src/cloudflare-worker\.mjs|src/configure\.js|src/diagnostics\.js|src/subsource-archive\.js|src/subsource\.js|src/selector\.js|src/subtitles\.js|test/nuvio-worker\.test\.js|test/v2-part5-1-subsource-discovery\.test\.js|test/v2-part5-2-subsource-fusion\.test\.js|docs/PART5-2_SUBSOURCE_FUSION\.md)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          if rg -n "subsourceApiKey.*(url|query)|[?&](apiKey|key)=" src --glob '!configure.js'; then
            echo "Potential SubSource key exposure path detected."
            exit 1
          fi

      - name: Cloudflare Worker dry run
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir .cf-build

      - name: Commit verified Part 5.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json             src/cloudflare-worker.mjs src/configure.js src/diagnostics.js             src/subsource.js src/subsource-archive.js src/selector.js src/subtitles.js             test/nuvio-worker.test.js test/v2-part5-1-subsource-discovery.test.js             test/v2-part5-2-subsource-fusion.test.js docs/PART5-2_SUBSOURCE_FUSION.md
          git commit -m "Add adaptive SubSource fusion"
          git push origin HEAD:main
